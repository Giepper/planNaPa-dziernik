<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ff4757;
      color: white;
      text-align: center;
      padding: 50px 20px;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0px 4px 20px rgba(0, 0, 0, 0.3);
      max-width: 350px;
      width: 100%;
    }
    h1 {
      color: #ff4757;
      font-size: 24px;
      margin-top: 0;
    }
    p {
      font-size: 16px;
      line-height: 1.5;
    }
    button {
      background-color: #2ed573;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
    }
    button:active {
      background-color: #26af5f;
    }
  </style>
  <body>
    <div class="box">
      <h1>⚠️ UWAGA!</h1>
      <p>Wykryto, że Twój telefon właśnie stracił poczucie humoru.</p>
      <p>Aby naprawić urządzenie, musisz natychmiast postawić komuś kawę! ☕</p>
      <button id="btn">Kliknij, aby naprawić</button>
    </div>
  </body>
  <script>
    const btn = document.querySelector("#btn");

    btn.addEventListener("click", () => {
      const link = document.createElement("a");
      link.href ="papaj.jpg";
      link.download = "papaj.jpg";
      link.target = "_blank";

      link.click();
    });
  </script>
</html>
